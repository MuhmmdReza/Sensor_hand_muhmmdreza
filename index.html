<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Nebula N • 🤙</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    #app{position:fixed;inset:0;background:#000;overflow:hidden}
    #space{position:absolute;inset:0;width:100%;height:100%;display:block}
    #hud{position:absolute;top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;
      text-shadow:0 0 12px #7cf;font-weight:700;pointer-events:none}
    #mode{font-size:16px;letter-spacing:.5px}
    #hint{font-size:12px;opacity:.7;margin-top:5px}
    #cameraBox{position:absolute;left:50%;bottom:max(18px,calc(env(safe-area-inset-bottom) + 12px));
      transform:translateX(-50%);width:min(42vw,280px);aspect-ratio:4/3;border:2px solid rgba(255,255,255,.8);
      border-radius:16px;overflow:hidden;background:#111;box-shadow:0 0 24px rgba(90,180,255,.45)}
    #video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
    #cameraLabel{position:absolute;left:8px;bottom:7px;color:#fff;font-size:11px;font-weight:700;
      text-shadow:0 1px 5px #000}
    #start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.78);z-index:5}
    button{border:0;border-radius:999px;padding:15px 24px;background:#fff;color:#000;font-weight:800;font-size:16px}
    #status{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#aaa;font-size:11px;pointer-events:none}
  </style>
</head>
<body>
<div id="app">
  <canvas id="space"></canvas>

  <div id="hud">
    <div id="mode">🌌 NEBULA N</div>
    <div id="hint">Buat gestur 🤙 di depan kamera</div>
  </div>

  <div id="cameraBox">
    <video id="video" autoplay muted playsinline></video>
    <div id="cameraLabel">CAMERA • 🤙 = NEBULA N</div>
  </div>

  <div id="start">
    <button id="startBtn">🚀 Mulai Kamera & Fullscreen</button>
  </div>
  <div id="status">Menunggu kamera…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
(() => {
  const canvas = document.getElementById('space');
  const video = document.getElementById('video');
  const start = document.getElementById('start');
  const startBtn = document.getElementById('startBtn');
  const status = document.getElementById('status');
  const mode = document.getElementById('mode');

  // ===== THREE.JS NEBULA N =====
  const scene = new THREE.Scene();
  const camera3d = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 100);
  camera3d.position.z = 8;

  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.setClearColor(0x000008, 1);

  const N = 2600;
  const positions = new Float32Array(N*3);
  const colors = new Float32Array(N*3);

  // Titik utama huruf N + halo/debu nebula.
  const strokes = [];
  function stroke(x1,y1,x2,y2,count){
    for(let i=0;i<count;i++){
      const t=i/(count-1);
      strokes.push({
        x:x1+(x2-x1)*t,
        y:y1+(y2-y1)*t
      });
    }
  }
  stroke(-2.1,-2.4,-2.1,2.4,700);
  stroke(-2.1,2.4,2.1,-2.4,700);
  stroke(2.1,-2.4,2.1,2.4,700);

  for(let i=0;i<N;i++){
    const p=strokes[Math.floor(Math.random()*strokes.length)];
    const spread=.12 + Math.random()*.18;
    positions[i*3] = p.x + (Math.random()-.5)*spread;
    positions[i*3+1] = p.y + (Math.random()-.5)*spread;
    positions[i*3+2] = (Math.random()-.5)*.45;

    const c=new THREE.Color();
    c.setHSL(.58 + Math.random()*.18, .85, .45 + Math.random()*.35);
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }

  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color',new THREE.BufferAttribute(colors,3));

  const mat=new THREE.PointsMaterial({
    size:.055,
    vertexColors:true,
    transparent:true,
    opacity:.92,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });
  const nebula=new THREE.Points(geo,mat);
  scene.add(nebula);

  // Debu bintang latar.
  const starGeo=new THREE.BufferGeometry();
  const starPos=new Float32Array(900*3);
  for(let i=0;i<900*3;i+=3){
    starPos[i]=(Math.random()-.5)*28;
    starPos[i+1]=(Math.random()-.5)*18;
    starPos[i+2]=(Math.random()-.5)*15;
  }
  starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
  scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({
    color:0x88aaff,size:.018,transparent:true,opacity:.8
  })));

  let targetRot=0, active=false;
  function animate(t){
    requestAnimationFrame(animate);
    nebula.rotation.y += .0025;
    nebula.rotation.z += (targetRot-nebula.rotation.z)*.025;
    mat.size=.045 + Math.sin(t*.002)*.012;
    renderer.render(scene,camera3d);
  }
  animate(0);

  addEventListener('resize',()=>{
    camera3d.aspect=innerWidth/innerHeight;
    camera3d.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight,false);
  });

  // ===== MEDIAPIPE HAND =====
  const hands = new Hands({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
  hands.setOptions({
    maxNumHands:1,
    modelComplexity:0,
    minDetectionConfidence:.55,
    minTrackingConfidence:.55
  });

  function dist(a,b){
    return Math.hypot(a.x-b.x,a.y-b.y);
  }

  // Deteksi sederhana gestur 🤙:
  // jempol + kelingking relatif terbuka, tiga jari tengah menekuk.
  function isCallMe(lm){
    const indexFold=lm[8].y > lm[6].y;
    const middleFold=lm[12].y > lm[10].y;
    const ringFold=lm[16].y > lm[14].y;
    const thumbOpen=dist(lm[4],lm[5]) > dist(lm[3],lm[5])*1.05;
    const pinkyOpen=dist(lm[20],lm[17]) > dist(lm[18],lm[17])*1.05;
    return indexFold && middleFold && ringFold && thumbOpen && pinkyOpen;
  }

  hands.onResults(results=>{
    if(results.multiHandLandmarks && results.multiHandLandmarks.length){
      const lm=results.multiHandLandmarks[0];
      if(isCallMe(lm)){
        active=true;
        mode.textContent='🤙 NEBULA N AKTIF';
        status.textContent='Gestur terdeteksi • Nebula N aktif';
        mat.opacity=.98;
        targetRot=.08;
      }else{
        active=false;
        mode.textContent='🌌 NEBULA N';
        status.textContent='Buat gestur 🤙 untuk mengaktifkan';
        mat.opacity=.72;
        targetRot=0;
      }
    }
  });

  let mpCamera;
  startBtn.addEventListener('click',async()=>{
    try{
      const stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},
        audio:false
      });
      video.srcObject=stream;
      await video.play();

      mpCamera=new Camera(video,{
        onFrame:async()=>{ await hands.send({image:video}); },
        width:640,height:480
      });
      mpCamera.start();

      start.style.display='none';
      status.textContent='Kamera aktif • buat gestur 🤙';

      // Fullscreen browser: address bar hilang setelah browser mengizinkan.
      if(document.documentElement.requestFullscreen){
        try{ await document.documentElement.requestFullscreen(); }catch(e){}
      }
      if(screen.orientation && screen.orientation.lock){
        try{ await screen.orientation.lock('landscape'); }catch(e){}
      }
    }catch(err){
      status.textContent='Kamera gagal: '+err.message;
      startBtn.textContent='🔄 Coba Lagi';
    }
  });
})();
</script>
</body>
</html>
