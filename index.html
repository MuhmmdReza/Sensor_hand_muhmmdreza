<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Hand Galaxy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    html, body { background: #000; overflow: hidden; height: 100%; width: 100%; color: #fff; user-select: none; }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    .ui { position: absolute; z-index: 10; pointer-events: none; }
    .top-left { top: 16px; left: 16px; }
    .title {
      font-size: 18px; font-weight: 700; letter-spacing: 1px;
      background: linear-gradient(90deg, #00f0ff, #ff00ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: flex; align-items: center; gap: 8px;
    }
    .title .infinity { font-size: 24px; color: #00f0ff; -webkit-text-fill-color: #00f0ff; }
    .subtitle { font-size: 11px; color: #00f0ff; margin-top: 2px; opacity: 0.8; }

    .status-box {
      position: absolute; top: 16px; right: 16px;
      background: rgba(0,12,25,0.8); border: 1px solid #00f0ff;
      border-radius: 10px; padding: 7px 12px; font-size: 12px; color: #00ff9d;
      display: flex; align-items: center; gap: 6px; backdrop-filter: blur(6px);
    }
    .status-dot {
      width: 7px; height: 7px; background: #00ff9d; border-radius: 50%;
      box-shadow: 0 0 6px #00ff9d; animation: pulse 1.4s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .gesture-name {
      position: absolute; top: 55px; right: 16px;
      background: rgba(0,12,25,0.85); border: 1px solid #ff2d95;
      border-radius: 8px; padding: 5px 12px; font-size: 12px; color: #ff9de0;
      display: none; backdrop-filter: blur(6px);
    }

    #camera-container {
      position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
      width: 180px; height: 135px; border-radius: 12px; overflow: hidden;
      border: 2px solid #00f0ff; box-shadow: 0 0 16px rgba(0,240,255,0.4); z-index: 20; background: #000;
    }
    #video { width: 100%; height: 100%; object-fit: cover; }
    #camera-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    .bottom-bar {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 90px;
      background: linear-gradient(to top, rgba(0,0,0,0.92), transparent);
      display: flex; justify-content: center; align-items: center; gap: 32px; z-index: 30;
    }
    .btn {
      width: 54px; height: 54px; border-radius: 50%; border: 2.5px solid;
      background: transparent; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s; position: relative;
    }
    .btn-camera { border-color: #00f0ff; color: #00f0ff; }
    .btn-camera:hover { background: rgba(0,240,255,0.15); box-shadow: 0 0 16px #00f0ff; }
    .btn-stop { border-color: #ff2d95; color: #ff2d95; }
    .btn-stop:hover { background: rgba(255,45,149,0.15); box-shadow: 0 0 16px #ff2d95; }
    .btn-fs { border-color: #c4f; color: #e0f; }
    .btn-fs:hover { background: rgba(180,0,255,0.15); box-shadow: 0 0 16px #c4f; }
    .btn span { position: absolute; bottom: -18px; font-size: 10px; font-weight: 600; }

    .hint { position: absolute; bottom: 14px; left: 14px; font-size: 11px; color: #888; }
    .hint-right { position: absolute; bottom: 14px; right: 14px; font-size: 11px; color: #888; }

    .loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: #00f0ff; font-size: 15px; z-index: 100; text-align: center; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    Klik <b>CAMERA</b> lalu <b>FULLSCREEN</b><br>
    <small style="opacity:0.7">Gunakan pola tangan</small>
  </div>

  <canvas id="canvas"></canvas>

  <div class="ui top-left">
    <div class="title"><span class="infinity">∞</span> NEON HAND GALAXY</div>
    <div class="subtitle">HAND GESTURE • 3D NEON PARTICLE</div>
  </div>

  <div class="status-box">
    <div class="status-dot"></div>
    <span id="statusText">Menunggu kamera...</span>
  </div>

  <div class="gesture-name" id="gestureName">—</div>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="camera-overlay"></canvas>
  </div>

  <div class="bottom-bar">
    <div class="hint">Neon particle galaxy</div>

    <button class="btn btn-camera" id="btnCamera">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <span>CAMERA</span>
    </button>

    <button class="btn btn-stop" id="btnStop">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
      <span>STOP</span>
    </button>

    <button class="btn btn-fs" id="btnFullscreen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
      <span>FULLSCREEN</span>
    </button>

    <div class="hint-right">Gesture mode</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('video');
    const camOverlay = document.getElementById('camera-overlay');
    const camCtx = camOverlay.getContext('2d');
    const loading = document.getElementById('loading');
    const statusText = document.getElementById('statusText');
    const gestureNameEl = document.getElementById('gestureName');

    let W, H, particles = [], isRunning = false, camera = null;
    let handCenter = { x: 0, y: 0 };
    let currentGesture = 'none';
    let gestureStable = 'none';
    let gestureCounter = 0;
    const STABLE_FRAMES = 4; // anti kedip

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      camOverlay.width = 180;
      camOverlay.height = 135;
    }
    window.addEventListener('resize', resize);
    resize();

    // ========== PARTICLE ==========
    class Particle {
      constructor() {
        this.x = W / 2;
        this.y = H / 2;
        this.vx = 0;
        this.vy = 0;
        this.size = 0.55 + Math.random() * 1.25;
        this.hue = 260 + Math.random() * 100;
        this.target = { x: W / 2, y: H / 2 };
        this.angle = Math.random() * Math.PI * 2;
        this.orbit = 0.3 + Math.random() * 0.5;
      }
      update() {
        const dx = this.target.x - this.x;
        const dy = this.target.y - this.y;
        this.vx += dx * 0.08;
        this.vy += dy * 0.08;
        this.vx *= 0.84;
        this.vy *= 0.84;
        this.x += this.vx;
        this.y += this.vy;
        this.angle += 0.015;
        this.x += Math.cos(this.angle) * this.orbit;
        this.y += Math.sin(this.angle) * this.orbit * 0.7;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 100%, 65%, 0.88)`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, 0.75)`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function initParticles(n = 500) {
      particles = [];
      for (let i = 0; i < n; i++) particles.push(new Particle());
    }

    // ========== SHAPES ==========
    function makeBall(cx, cy, r = 68) {
      const pts = [];
      for (let i = 0; i < 500; i++) {
        const a = Math.random() * Math.PI * 2;
        const b = Math.acos(2 * Math.random() - 1);
        pts.push({
          x: cx + r * Math.sin(b) * Math.cos(a),
          y: cy + r * Math.sin(b) * Math.sin(a) * 0.82
        });
      }
      return pts;
    }

    function makeDonut(cx, cy, R = 72, r = 26) {
      const pts = [];
      for (let i = 0; i < 500; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI * 2;
        pts.push({
          x: cx + (R + r * Math.cos(phi)) * Math.cos(theta),
          y: cy + (R + r * Math.cos(phi)) * Math.sin(theta) * 0.72
        });
      }
      return pts;
    }

    function makeHeart(cx, cy, s = 1.05) {
      const pts = [];
      for (let i = 0; i < 500; i++) {
        const t = Math.random() * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        pts.push({ x: cx + x * s * 2.7, y: cy + y * s * 2.7 });
      }
      return pts;
    }

    function makeScatter(cx, cy) {
      const pts = [];
      for (let i = 0; i < 500; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 50 + Math.random() * 210;
        pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * 0.68 });
      }
      return pts;
    }

    function makeLetterN(cx, cy, s = 52) {
      const pts = [];
      for (let i = 0; i < 160; i++) pts.push({ x: cx - s, y: cy - s + (i / 160) * s * 2 });
      for (let i = 0; i < 180; i++) pts.push({ x: cx - s + (i / 180) * s * 2, y: cy - s + (i / 180) * s * 2 });
      for (let i = 0; i < 160; i++) pts.push({ x: cx + s, y: cy - s + (i / 160) * s * 2 });
      return pts;
    }

    function makeLetterR(cx, cy, s = 52) {
      const pts = [];
      for (let i = 0; i < 150; i++) pts.push({ x: cx - s, y: cy - s + (i / 150) * s * 2 });
      for (let i = 0; i < 110; i++) {
        const a = (i / 110) * Math.PI;
        pts.push({ x: cx - s + Math.sin(a) * s * 1.05, y: cy - s + (1 - Math.cos(a)) * s * 0.65 });
      }
      for (let i = 0; i < 130; i++) pts.push({ x: cx - s + (i / 130) * s * 1.45, y: cy + (i / 130) * s * 0.95 });
      return pts;
    }

    function applyShape(type, cx, cy) {
      let pts;
      if (type === 'ball') pts = makeBall(cx, cy);
      else if (type === 'donut') pts = makeDonut(cx, cy);
      else if (type === 'heart') pts = makeHeart(cx, cy);
      else if (type === 'scatter') pts = makeScatter(cx, cy);
      else if (type === 'N') pts = makeLetterN(cx, cy);
      else if (type === 'R') pts = makeLetterR(cx, cy);
      else pts = makeBall(cx, cy, 45);

      for (let i = 0; i < particles.length; i++) {
        particles[i].target = pts[i % pts.length];
      }
    }

    // ========== OPTIMIZED GESTURE DETECTION ==========
    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function isExtended(landmarks, tip, pip, mcp) {
      // lebih robust: tip harus lebih jauh dari mcp daripada pip
      const tipToMcp = distance(landmarks[tip], landmarks[mcp]);
      const pipToMcp = distance(landmarks[pip], landmarks[mcp]);
      return tipToMcp > pipToMcp * 1.15;
    }

    function detectGesture(landmarks, handedness) {
      const isRight = handedness === 'Right';

      // Finger states
      const thumbExt = isRight
        ? landmarks[4].x < landmarks[3].x - 0.02
        : landmarks[4].x > landmarks[3].x + 0.02;

      const indexExt  = isExtended(landmarks, 8, 6, 5);
      const middleExt = isExtended(landmarks, 12, 10, 9);
      const ringExt   = isExtended(landmarks, 16, 14, 13);
      const pinkyExt  = isExtended(landmarks, 20, 18, 17);

      const extCount = [indexExt, middleExt, ringExt, pinkyExt].filter(Boolean).length;

      // Jarak penting
      const thumbIndexDist = distance(landmarks[4], landmarks[8]);
      const thumbPinkyDist = distance(landmarks[4], landmarks[20]);

      // 1. Fist (semua jari tertutup)
      if (!indexExt && !middleExt && !ringExt && !pinkyExt) {
        return 'ball';
      }

      // 2. Open hand / 🖐️
      if (extCount >= 4) {
        return 'scatter';
      }

      // 3. OK / 👌 (thumb dekat index tip + jari lain down)
      if (indexExt && !middleExt && !ringExt && !pinkyExt && thumbIndexDist < 0.065) {
        return 'donut';
      }

      // 4. Heart / 🫰 (index + thumb extended, jarak sedang, jari lain down)
      if (indexExt && thumbExt && !middleExt && !ringExt && !pinkyExt && thumbIndexDist < 0.12) {
        return 'heart';
      }

      // 5. Pointing (hanya index) → N
      if (indexExt && !middleExt && !ringExt && !pinkyExt && !thumbExt) {
        return 'N';
      }

      // 6. Call me / 🤙 (thumb + pinky)
      if (thumbExt && pinkyExt && !indexExt && !middleExt && !ringExt) {
        return 'R';
      }

      // Fallback
      if (extCount >= 3) return 'scatter';
      if (extCount <= 1) return 'ball';
      return 'heart';
    }

    // ========== MEDIAPIPE ==========
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.72,
      minTrackingConfidence: 0.65
    });

    hands.onResults(onResults);

    function onResults(results) {
      camCtx.save();
      camCtx.clearRect(0, 0, camOverlay.width, camOverlay.height);
      camCtx.drawImage(results.image, 0, 0, camOverlay.width, camOverlay.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        const handedness = results.multiHandedness[0].label; // "Left" or "Right"

        drawConnectors(camCtx, lm, HAND_CONNECTIONS, { color: '#00f0ff', lineWidth: 1.5 });
        drawLandmarks(camCtx, lm, { color: '#ff2d95', lineWidth: 1, radius: 2.2 });

        // Palm center
        handCenter.x = lm[9].x * W;
        handCenter.y = lm[9].y * H;

        // Detect + smoothing
        const rawGesture = detectGesture(lm, handedness);

        if (rawGesture === currentGesture) {
          gestureCounter++;
        } else {
          gestureCounter = 0;
          currentGesture = rawGesture;
        }

        if (gestureCounter >= STABLE_FRAMES && gestureStable !== currentGesture) {
          gestureStable = currentGesture;
          applyShape(gestureStable, handCenter.x, handCenter.y);

          const names = {
            ball: 'BOLA',
            donut: 'DONAT',
            heart: 'LOVE',
            scatter: 'HANCUR',
            N: 'HURUF N',
            R: 'HURUF R'
          };
          gestureNameEl.style.display = 'block';
          gestureNameEl.textContent = names[gestureStable] || gestureStable;
        } else {
          // tetap update posisi bentuk biar ikut tangan
          applyShape(gestureStable, handCenter.x, handCenter.y);
        }

        statusText.textContent = 'HAND DETECTED';
      } else {
        currentGesture = 'none';
        gestureStable = 'none';
        gestureCounter = 0;
        gestureNameEl.style.display = 'none';
        statusText.textContent = 'Mencari tangan...';
      }
      camCtx.restore();
    }

    // ========== ANIMATE ==========
    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 5, 0.2)';
      ctx.fillRect(0, 0, W, H);
      for (const p of particles) {
        p.update();
        p.draw();
      }
      requestAnimationFrame(animate);
    }

    // ========== CONTROLS ==========
    document.getElementById('btnCamera').onclick = async () => {
      if (isRunning) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 640, height: 480 }
        });
        video.srcObject = stream;
        await video.play();

        camera = new Camera(video, {
          onFrame: async () => await hands.send({ image: video }),
          width: 640,
          height: 480
        });
        camera.start();
        isRunning = true;
        loading.style.display = 'none';
        initParticles(500);
        applyShape('ball', W / 2, H / 2 - 40);
        statusText.textContent = 'Kamera aktif';
      } catch (e) {
        alert('Izinkan akses kamera');
      }
    };

    document.getElementById('btnStop').onclick = () => {
      if (camera) { camera.stop(); camera = null; }
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
      }
      isRunning = false;
      particles = [];
      gestureStable = 'none';
      gestureNameEl.style.display = 'none';
      statusText.textContent = 'Stopped';
      loading.style.display = 'block';
      loading.innerHTML = 'Kamera dimatikan<br><small>Klik CAMERA untuk mulai</small>';
    };

    document.getElementById('btnFullscreen').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    };

    // Start
    initParticles(420);
    applyShape('ball', W / 2, H / 2);
    animate();
  </script>
</body>
</html>
