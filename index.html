<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Hand Galaxy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    html, body {
      background: #000;
      overflow: hidden;
      height: 100%;
      width: 100%;
      color: #fff;
      user-select: none;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .ui {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }

    .top-left {
      top: 18px;
      left: 18px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #00f0ff, #ff00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title .infinity {
      font-size: 26px;
      color: #00f0ff;
      -webkit-text-fill-color: #00f0ff;
    }

    .subtitle {
      font-size: 11px;
      color: #00f0ff;
      margin-top: 3px;
      opacity: 0.85;
    }

    .status-box {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(0, 15, 30, 0.75);
      border: 1px solid #00f0ff;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 12px;
      color: #00ff9d;
      display: flex;
      align-items: center;
      gap: 7px;
      backdrop-filter: blur(6px);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #00ff9d;
      border-radius: 50%;
      box-shadow: 0 0 6px #00ff9d;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .finger-status {
      position: absolute;
      top: 60px;
      right: 18px;
      background: rgba(0, 15, 30, 0.75);
      border: 1px solid #00f0ff;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      color: #00f0ff;
      display: none;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(6px);
    }

    /* Camera Preview - bawah & tidak distorsi */
    #camera-container {
      position: absolute;
      bottom: 105px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 150px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #00f0ff;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.45);
      z-index: 20;
      background: #000;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* TANPA mirror */
    }

    #camera-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 95px;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 36px;
      z-index: 30;
      pointer-events: auto;
    }

    .btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2.5px solid;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .btn-camera {
      border-color: #00f0ff;
      color: #00f0ff;
    }
    .btn-camera:hover {
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 18px #00f0ff;
    }

    .btn-stop {
      border-color: #ff2d95;
      color: #ff2d95;
    }
    .btn-stop:hover {
      background: rgba(255, 45, 149, 0.15);
      box-shadow: 0 0 18px #ff2d95;
    }

    .btn-fs {
      border-color: #a0f;
      color: #c8f;
    }
    .btn-fs:hover {
      background: rgba(170, 0, 255, 0.15);
      box-shadow: 0 0 18px #a0f;
    }

    .btn span {
      position: absolute;
      bottom: -20px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .hint {
      position: absolute;
      bottom: 16px;
      left: 16px;
      font-size: 11px;
      color: #999;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .hint-right {
      position: absolute;
      bottom: 16px;
      right: 16px;
      font-size: 11px;
      color: #999;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00f0ff;
      font-size: 16px;
      z-index: 100;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    Klik CAMERA untuk mulai<br>
    <small style="font-size:12px;opacity:0.7">Lalu klik FULLSCREEN</small>
  </div>

  <canvas id="canvas"></canvas>

  <div class="ui top-left">
    <div class="title">
      <span class="infinity">∞</span>
      NEON HAND GALAXY
    </div>
    <div class="subtitle">DRAW WITH YOUR FINGER • 3D PARTICLE EFFECT</div>
  </div>

  <div class="status-box" id="statusBox">
    <div class="status-dot"></div>
    <span id="statusText">Menunggu kamera...</span>
  </div>

  <div class="finger-status" id="fingerStatus">
    ✋ Index Finger Detected
  </div>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="camera-overlay"></canvas>
  </div>

  <div class="bottom-bar">
    <div class="hint">
      <span>🧊</span>
      Build your imagination with neon particles
    </div>

    <button class="btn btn-camera" id="btnCamera">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <span>CAMERA</span>
    </button>

    <button class="btn btn-stop" id="btnStop">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="6" width="12" height="12" rx="1"/>
      </svg>
      <span>STOP</span>
    </button>

    <button class="btn btn-fs" id="btnFullscreen">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
      <span>FULLSCREEN</span>
    </button>

    <div class="hint-right">
      Use your index finger to draw anything
      <span>👆</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('video');
    const camOverlay = document.getElementById('camera-overlay');
    const camCtx = camOverlay.getContext('2d');
    const loading = document.getElementById('loading');
    const statusText = document.getElementById('statusText');
    const fingerStatus = document.getElementById('fingerStatus');

    let width, height;
    let particles = [];
    let isRunning = false;
    let camera = null;
    let lastFinger = null;
    let galaxyCenter = { x: 0, y: 0 };
    let time = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      camOverlay.width = 200;
      camOverlay.height = 150;
      galaxyCenter = { x: width / 2, y: height / 2 - 40 };
    }
    window.addEventListener('resize', resize);
    resize();

    // ====================== PARTICLE ======================
    class Particle {
      constructor(x, y, isGalaxy = false) {
        this.x = x;
        this.y = y;
        this.ox = x; // original for galaxy pull
        this.oy = y;
        this.vx = (Math.random() - 0.5) * 2.2;
        this.vy = (Math.random() - 0.5) * 2.2;
        this.life = 1;
        this.decay = isGalaxy ? 0.003 + Math.random() * 0.004 : 0.012 + Math.random() * 0.01;
        this.size = 0.7 + Math.random() * 1.6;   // LEBIH KECIL
        this.hue = 270 + Math.random() * 90;
        this.isGalaxy = isGalaxy;
        this.angle = Math.random() * Math.PI * 2;
        this.radius = Math.random() * 180 + 40;
        this.speed = 0.008 + Math.random() * 0.012;
      }

      update(finger) {
        if (this.isGalaxy && !finger) {
          // Galaksi berputar
          this.angle += this.speed;
          this.x = galaxyCenter.x + Math.cos(this.angle) * this.radius;
          this.y = galaxyCenter.y + Math.sin(this.angle) * this.radius * 0.6;
          this.vx *= 0.95;
          this.vy *= 0.95;
        } else if (finger) {
          // Tarik ke jari + gerak cepat
          const dx = finger.x - this.x;
          const dy = finger.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          this.vx += (dx / dist) * 0.35;
          this.vy += (dy / dist) * 0.35;
          this.vx *= 0.92;
          this.vy *= 0.92;
          this.x += this.vx;
          this.y += this.vy;
        } else {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.96;
          this.vy *= 0.96;
        }

        this.life -= this.decay;
      }

      draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 100%, 68%, ${this.life * 0.9})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, 0.7)`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // Buat galaksi awal
    function createGalaxy(count = 450) {
      particles = [];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = Math.random() * 160 + 30;
        const x = galaxyCenter.x + Math.cos(angle) * r;
        const y = galaxyCenter.y + Math.sin(angle) * r * 0.55;
        particles.push(new Particle(x, y, true));
      }
    }

    function emitFromFinger(x, y, count = 5) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x + (Math.random()-0.5)*8, y + (Math.random()-0.5)*8, false));
      }
      if (particles.length > 900) {
        particles.splice(0, particles.length - 900);
      }
    }

    // ====================== HAND ======================
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.55
    });

    hands.onResults(onResults);

    function onResults(results) {
      camCtx.save();
      camCtx.clearRect(0, 0, camOverlay.width, camOverlay.height);
      camCtx.drawImage(results.image, 0, 0, camOverlay.width, camOverlay.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        const tip = landmarks[8];

        // TANPA mirror
        const x = tip.x * width;
        const y = tip.y * height;

        drawConnectors(camCtx, landmarks, HAND_CONNECTIONS, {color: '#00f0ff', lineWidth: 1.5});
        drawLandmarks(camCtx, landmarks, {color: '#ff2d95', lineWidth: 1, radius: 2.5});

        camCtx.beginPath();
        camCtx.arc(tip.x * camOverlay.width, tip.y * camOverlay.height, 7, 0, Math.PI*2);
        camCtx.strokeStyle = '#00ff9d';
        camCtx.lineWidth = 2;
        camCtx.stroke();

        if (lastFinger) {
          const dist = Math.hypot(x - lastFinger.x, y - lastFinger.y);
          const count = Math.min(9, Math.floor(dist / 2.5) + 2);
          emitFromFinger(x, y, count);
        } else {
          emitFromFinger(x, y, 6);
        }
        lastFinger = { x, y };

        statusText.textContent = "HAND DETECTED • Tracking...";
        fingerStatus.style.display = "flex";
      } else {
        lastFinger = null;
        statusText.textContent = "Mencari tangan...";
        fingerStatus.style.display = "none";
      }
      camCtx.restore();
    }

    // ====================== ANIMATE ======================
    function animate() {
      time += 0.016;
      ctx.fillStyle = 'rgba(0, 0, 6, 0.22)';
      ctx.fillRect(0, 0, width, height);

      const finger = lastFinger;

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update(finger);
        p.draw(ctx);
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Jaga jumlah partikel galaksi tetap ada
      if (!finger && particles.length < 380) {
        createGalaxy(80);
      }

      requestAnimationFrame(animate);
    }

    // ====================== CONTROLS ======================
    document.getElementById('btnCamera').addEventListener('click', async () => {
      if (isRunning) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        video.srcObject = stream;
        await video.play();

        camera = new Camera(video, {
          onFrame: async () => {
            await hands.send({ image: video });
          },
          width: 640,
          height: 480
        });
        camera.start();
        isRunning = true;
        loading.style.display = 'none';
        createGalaxy(450);
        statusText.textContent = "Kamera aktif";
      } catch (err) {
        alert('Gagal akses kamera. Izinkan kamera ya.');
        console.error(err);
      }
    });

    document.getElementById('btnStop').addEventListener('click', () => {
      if (camera) { camera.stop(); camera = null; }
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
      }
      isRunning = false;
      particles = [];
      lastFinger = null;
      statusText.textContent = "Stopped";
      fingerStatus.style.display = "none";
      loading.style.display = 'block';
      loading.innerHTML = "Kamera dimatikan<br><small>Klik CAMERA untuk mulai lagi</small>";
    });

    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert('Fullscreen gagal: ' + err.message);
        });
      } else {
        document.exitFullscreen();
      }
    });

    // Auto create galaxy saat load
    createGalaxy(400);
    animate();
  </script>
</body>
</html>
