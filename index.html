<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Hand Galaxy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: #000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      color: #fff;
      user-select: none;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ===== UI Overlay ===== */
    .ui {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }

    .top-left {
      top: 20px;
      left: 20px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #00f0ff, #ff00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title .infinity {
      font-size: 28px;
      color: #00f0ff;
      -webkit-text-fill-color: #00f0ff;
    }

    .subtitle {
      font-size: 12px;
      color: #00f0ff;
      margin-top: 4px;
      opacity: 0.9;
    }

    .status-box {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 20, 40, 0.7);
      border: 1px solid #00f0ff;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 13px;
      color: #00ff9d;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #00ff9d;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff9d;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .finger-status {
      position: absolute;
      top: 70px;
      right: 20px;
      background: rgba(0, 20, 40, 0.7);
      border: 1px solid #00f0ff;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      color: #00f0ff;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
    }

    /* ===== Camera Preview di BAWAH ===== */
    #camera-container {
      position: absolute;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 160px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      z-index: 20;
      background: #000;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror */
    }

    #camera-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ===== Bottom Controls ===== */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100px;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      z-index: 30;
      pointer-events: auto;
    }

    .btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .btn-camera {
      border-color: #00f0ff;
      color: #00f0ff;
    }
    .btn-camera:hover {
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 20px #00f0ff;
    }

    .btn-stop {
      border-color: #ff2d95;
      color: #ff2d95;
    }
    .btn-stop:hover {
      background: rgba(255, 45, 149, 0.15);
      box-shadow: 0 0 20px #ff2d95;
    }

    .btn span {
      position: absolute;
      bottom: -22px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .hint {
      position: absolute;
      bottom: 18px;
      left: 20px;
      font-size: 12px;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hint-right {
      position: absolute;
      bottom: 18px;
      right: 20px;
      font-size: 12px;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00f0ff;
      font-size: 18px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">Loading Hand Tracking...</div>

  <canvas id="canvas"></canvas>

  <!-- UI Top -->
  <div class="ui top-left">
    <div class="title">
      <span class="infinity">∞</span>
      NEON HAND GALAXY
    </div>
    <div class="subtitle">DRAW WITH YOUR FINGER • 3D PARTICLE EFFECT</div>
  </div>

  <div class="status-box" id="statusBox">
    <div class="status-dot"></div>
    <span id="statusText">HAND DETECTED • Tracking...</span>
  </div>

  <div class="finger-status" id="fingerStatus">
    ✋ Index Finger Detected
  </div>

  <!-- Camera Preview di BAWAH -->
  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="camera-overlay"></canvas>
  </div>

  <!-- Bottom Controls -->
  <div class="bottom-bar">
    <div class="hint">
      <span style="font-size:16px">🧊</span>
      Build your imagination with neon particles
    </div>

    <button class="btn btn-camera" id="btnCamera" title="Start Camera">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <span>CAMERA</span>
    </button>

    <button class="btn btn-stop" id="btnStop" title="Stop">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="6" width="12" height="12" rx="1"/>
      </svg>
      <span>STOP</span>
    </button>

    <div class="hint-right">
      Use your index finger to draw anything
      <span style="font-size:16px">👆</span>
    </div>
  </div>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    // ====================== SETUP ======================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('video');
    const camOverlay = document.getElementById('camera-overlay');
    const camCtx = camOverlay.getContext('2d');
    const loading = document.getElementById('loading');
    const statusText = document.getElementById('statusText');
    const fingerStatus = document.getElementById('fingerStatus');

    let width, height;
    let particles = [];
    let isRunning = false;
    let camera = null;
    let lastFinger = null;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      camOverlay.width = 220;
      camOverlay.height = 160;
    }
    window.addEventListener('resize', resize);
    resize();

    // ====================== PARTICLE SYSTEM ======================
    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 1.8;
        this.vy = (Math.random() - 0.5) * 1.8;
        this.life = 1.0;
        this.decay = 0.008 + Math.random() * 0.012;
        this.size = 1.5 + Math.random() * 3.5;
        this.hue = 280 + Math.random() * 80; // purple → pink → cyan
        this.trail = [];
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.97;
        this.vy *= 0.97;
        this.life -= this.decay;

        // slight orbit / swirl
        this.vx += Math.sin(this.y * 0.01) * 0.05;
        this.vy += Math.cos(this.x * 0.01) * 0.05;

        this.trail.push({x: this.x, y: this.y, life: this.life});
        if (this.trail.length > 8) this.trail.shift();
      }

      draw(ctx) {
        // trail
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i];
          const alpha = (i / this.trail.length) * t.life * 0.6;
          ctx.beginPath();
          ctx.arc(t.x, t.y, this.size * 0.6, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${alpha})`;
          ctx.fill();
        }

        // main particle
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 100%, 65%, ${this.life})`;
        ctx.shadowBlur = 15;
        ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, 0.8)`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function emitParticles(x, y, count = 6) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y));
      }
      // limit total particles
      if (particles.length > 1200) {
        particles.splice(0, particles.length - 1200);
      }
    }

    // ====================== HAND TRACKING ======================
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    function onResults(results) {
      // clear camera overlay
      camCtx.save();
      camCtx.clearRect(0, 0, camOverlay.width, camOverlay.height);
      camCtx.drawImage(results.image, 0, 0, camOverlay.width, camOverlay.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        
        // Index finger tip = landmark 8
        const tip = landmarks[8];
        
        // Convert to canvas coordinates (mirrored)
        const x = (1 - tip.x) * width;
        const y = tip.y * height;

        // Draw skeleton on camera preview
        drawConnectors(camCtx, landmarks, HAND_CONNECTIONS, {color: '#00f0ff', lineWidth: 2});
        drawLandmarks(camCtx, landmarks, {color: '#ff2d95', lineWidth: 1, radius: 3});

        // Highlight index finger
        camCtx.beginPath();
        camCtx.arc(tip.x * camOverlay.width, tip.y * camOverlay.height, 8, 0, Math.PI*2);
        camCtx.strokeStyle = '#00ff9d';
        camCtx.lineWidth = 2;
        camCtx.stroke();

        // Emit particles
        if (lastFinger) {
          const dist = Math.hypot(x - lastFinger.x, y - lastFinger.y);
          const count = Math.min(12, Math.floor(dist / 3) + 3);
          emitParticles(x, y, count);
        } else {
          emitParticles(x, y, 8);
        }
        lastFinger = {x, y};

        statusText.textContent = "HAND DETECTED • Tracking...";
        fingerStatus.style.display = "flex";
        fingerStatus.innerHTML = "✋ Index Finger Detected";
      } else {
        lastFinger = null;
        statusText.textContent = "Searching for hand...";
        fingerStatus.style.display = "none";
      }
      camCtx.restore();
    }

    // ====================== ANIMATION LOOP ======================
    function animate() {
      // fade background slightly for trail effect
      ctx.fillStyle = 'rgba(0, 0, 8, 0.18)';
      ctx.fillRect(0, 0, width, height);

      // update & draw particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    // ====================== CONTROLS ======================
    document.getElementById('btnCamera').addEventListener('click', async () => {
      if (isRunning) return;
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 640, height: 480 }
        });
        video.srcObject = stream;
        await video.play();

        camera = new Camera(video, {
          onFrame: async () => {
            await hands.send({image: video});
          },
          width: 640,
          height: 480
        });
        camera.start();
        isRunning = true;
        loading.style.display = 'none';
      } catch (err) {
        alert('Kamera tidak bisa diakses. Pastikan izin kamera diberikan.');
        console.error(err);
      }
    });

    document.getElementById('btnStop').addEventListener('click', () => {
      if (camera) {
        camera.stop();
        camera = null;
      }
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
      }
      isRunning = false;
      particles = [];
      lastFinger = null;
      statusText.textContent = "Stopped";
      fingerStatus.style.display = "none";
      loading.style.display = 'block';
      loading.textContent = "Camera Stopped";
    });

    // Start animation immediately
    animate();
    loading.textContent = "Klik tombol CAMERA untuk mulai";
  </script>
</body>
</html>
