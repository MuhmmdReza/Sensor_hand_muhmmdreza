<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Hand Galaxy</title>
<style>
:root{--cyan:#63f6ff;--pink:#ff48d7;--violet:#8d62ff;--bg:#03040c}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#fff}#app{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#11163b 0%,#050717 45%,#010207 100%)}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none;padding:18px;display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand{letter-spacing:.18em;text-transform:uppercase;font-weight:800;font-size:12px;color:var(--cyan);text-shadow:0 0 18px #2df6ff88}.status{font-size:11px;color:#b8c2ff;border:1px solid #6b70a866;border-radius:999px;padding:8px 11px;background:#070a1dcc;backdrop-filter:blur(10px)}.panel{position:absolute;right:18px;bottom:78px;width:180px;height:135px;border:1px solid #70eaff88;border-radius:16px;overflow:hidden;background:#080b1dcc;box-shadow:0 0 30px #23e8ff22}.panel video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.88}.panel .label{position:absolute;left:10px;bottom:8px;font-size:10px;letter-spacing:.12em;color:#d6ffff;text-transform:uppercase;text-shadow:0 0 8px #00eaff}.controls{display:flex;justify-content:center;gap:10px;pointer-events:auto}.btn{cursor:pointer;border:1px solid #5befff88;background:#071020dd;color:white;padding:12px 20px;border-radius:999px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;box-shadow:0 0 24px #00eaff15;transition:.2s}.btn:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 0 28px #00eaff55}.btn.stop{border-color:#ff55c888;color:#ffd2f7}.hint{font-size:11px;color:#8c97c8;text-align:center;margin-bottom:8px}.hidden{display:none!important}@media(max-width:600px){.panel{width:130px;height:100px;right:12px;bottom:78px}.hud{padding:12px}.brand{font-size:10px}.btn{padding:11px 15px}}
</style></head><body><div id="app"></div><div class="hud"><div class="top"><div class="brand">✦ NEON HAND GALAXY</div><div class="status" id="status">KAMERA NONAKTIF</div></div><div><div class="hint" id="hint">Aktifkan kamera, lalu gerakkan tangan di depan lensa</div><div class="controls"><button class="btn" id="cameraBtn">Kamera</button><button class="btn stop" id="stopBtn">Stop</button></div></div></div><div class="panel"><video id="preview" autoplay muted playsinline></video><div class="label">Live hand feed</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const app=document.querySelector('#app'),statusEl=document.querySelector('#status'),hint=document.querySelector('#hint'),video=document.querySelector('#preview');let stream=null,camera=null,running=false; let drawPoints=[],lastFinger={x:0,y:0},hasFinger=false; const DRAW_MAX=900;
const scene=new THREE.Scene();const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);app.appendChild(renderer.domElement);const camera3d=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);camera3d.position.z=8;
const group=new THREE.Group();scene.add(group);const count=11500,geo=new THREE.BufferGeometry(),pos=new Float32Array(count*3),vel=new Float32Array(count*3),seed=new Float32Array(count);for(let i=0;i<count;i++){const r=Math.pow(Math.random(),.45)*3.3,a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1);pos[i*3]=r*Math.sin(b)*Math.cos(a);pos[i*3+1]=r*Math.sin(b)*Math.sin(a);pos[i*3+2]=r*Math.cos(b);seed[i]=Math.random();vel[i*3]=(Math.random()-.5)*.002;vel[i*3+1]=(Math.random()-.5)*.002;vel[i*3+2]=(Math.random()-.5)*.002}geo.setAttribute('position',new THREE.BufferAttribute(pos,3));const mat=new THREE.PointsMaterial({size:.035,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,color:0x63f6ff});const particles=new THREE.Points(geo,mat);group.add(particles);
const ring=new THREE.Mesh(new THREE.TorusGeometry(2.8,.012,8,160),new THREE.MeshBasicMaterial({color:0xff48d7,transparent:true,opacity:.55,blending:THREE.AdditiveBlending}));ring.rotation.x=Math.PI/2;group.add(ring);
function addFingerPoint(x,y){const dx=x-lastFinger.x,dy=y-lastFinger.y,dist=Math.hypot(dx,dy),steps=Math.max(1,Math.ceil(dist/.018));for(let s=1;s<=steps;s++){const k=s/steps;drawPoints.push({x:lastFinger.x+dx*k,y:lastFinger.y+dy*k});}if(drawPoints.length>DRAW_MAX)drawPoints.splice(0,drawPoints.length-DRAW_MAX);lastFinger={x,y};}
function makeDrawShape(i,time){const s=seed[i];if(!drawPoints.length){const a=s*Math.PI*2,r=Math.pow(s,.45)*2.8;return[Math.cos(a)*r,Math.sin(a)*r,Math.sin(a*5+time)*.35];}const p=drawPoints[Math.min(Math.floor(s*drawPoints.length),drawPoints.length-1)],j=(s-.5)*.10;return[p.x*5.2+j,p.y*3.4+j,Math.sin(time*2+s*30)*.035+(s-.5)*.22];}
function animate(){requestAnimationFrame(animate);const t=performance.now()*.001;const arr=geo.attributes.position.array;for(let i=0;i<count;i++){const q=makeDrawShape(i,t);arr[i*3]+=(q[0]-arr[i*3])*.035;arr[i*3+1]+=(q[1]-arr[i*3+1])*.035;arr[i*3+2]+=(q[2]-arr[i*3+2])*.035;arr[i*3]+=Math.sin(t*1.5+seed[i]*20)*.0015;arr[i*3+1]+=Math.cos(t+seed[i]*15)*.0015}geo.attributes.position.needsUpdate=true;group.rotation.y+=.0018;group.rotation.x=Math.sin(t*.25)*.12;ring.rotation.z+=.003;renderer.render(scene,camera3d)}animate();
async function start(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;running=true;statusEl.textContent='KAMERA AKTIF • TRACKING';hint.textContent='Gerakkan telunjuk untuk menggambar dengan serbuk neon';const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.65,minTrackingConfidence:.6});hands.onResults(res=>{if(res.multiHandLandmarks?.length){const tip=res.multiHandLandmarks[0][8],x=(.5-tip.x)*2,y=(.5-tip.y)*-2;if(!hasFinger){lastFinger={x,y};hasFinger=true;}addFingerPoint(x,y);statusEl.textContent='KAMERA AKTIF • TELUNJUK TERDETEKSI';}else{hasFinger=false;statusEl.textContent='KAMERA AKTIF • CARI TELUNJUK';}});camera=new Camera(video,{onFrame:async()=>{if(running)await hands.send({image:video})},width:1280,height:720});camera.start()}catch(e){statusEl.textContent='IZIN KAMERA DITOLAK';hint.textContent='Izinkan akses kamera dan jalankan lewat HTTPS atau localhost'}}
function stop(){running=false;if(camera?.stop)camera.stop();if(stream)stream.getTracks().forEach(t=>t.stop());video.srcObject=null;statusEl.textContent='KAMERA NONAKTIF';hint.textContent='Kamera dihentikan'}document.querySelector('#cameraBtn').onclick=start;document.querySelector('#stopBtn').onclick=stop;addEventListener('resize',()=>{camera3d.aspect=innerWidth/innerHeight;camera3d.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
